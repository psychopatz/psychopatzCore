[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-uploader-gui"
version = "0.1.0"
description = "Portable Python GUI for Steam Workshop mod uploads"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
steam-uploader-gui = "steam_uploader_gui.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["steam_uploader_gui*"]
